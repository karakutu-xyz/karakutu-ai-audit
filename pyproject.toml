[project]
name = "karakutu-ai-audit"
version = "0.1.0"
description = "A local-first, reviewable news-audit workflow with immutable run provenance."
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "langgraph>=1,<2",
  "openai>=2,<3",
  "sqlalchemy>=2.0,<2.1",
  "httpx==0.28.1",
  "python-dotenv>=1,<2",
  "cryptography>=46,<47",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "rfc3339-validator>=0.1.4,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/audit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "--tb=short"
markers = ["postgres: isolated PostgreSQL storage integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
ignore = ["E701", "E702", "E731"]
